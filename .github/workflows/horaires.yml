# Recopie le planning des clubs (Google Sheets) dans docs/horaires.txt toutes les 15 minutes.
# Le monde VRChat lit https://<compte>.github.io/<depot>/horaires.txt (domaine accepte par VRChat).
name: Planning des clubs
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  maj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python horaires_clubs.py docs/horaires.txt
      - name: Enregistre si le planning a change
        run: |
          git config user.name "planning-clubs"
          git config user.email "actions@users.noreply.github.com"
          git add docs/horaires.txt
          git diff --cached --quiet || (git commit -m "Planning des clubs mis a jour" && git push)
